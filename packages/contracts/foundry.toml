[profile.default]
solc_version = "0.8.24"
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
gas_reports = ["VestingWallet", "VaultKitFactory", "VaultKitRegistry"]
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

# Heavier settings for CI (see .github/workflows/ci.yml)
[profile.ci]
fuzz = { runs = 2048 }
invariant = { runs = 256, depth = 64, fail_on_revert = false }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}" }
base = { key = "${BASESCAN_API_KEY}" }
